<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MazerationsMeister - Tank Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        .content {
            padding: 30px;
        }
        .tank-info {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .tank-info h2 {
            color: #667eea;
            font-size: 20px;
            margin-bottom: 15px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e9ecef;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: #495057;
        }
        .info-value {
            color: #212529;
            font-weight: 500;
        }
        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status.active {
            background: #d4edda;
            color: #155724;
        }
        .status.inactive {
            background: #f8d7da;
            color: #721c24;
        }
        .error {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-size: 12px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍷 MazerationsMeister</h1>
            <p>Tank Informationen Live</p>
        </div>
        
        <div class="content" id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Lade Tank-Daten...</p>
            </div>
        </div>
        
        <div class="footer">
            MazerationsMeister v4.8.1 | Powered by GitHub Pages
        </div>
    </div>

    <script>
        // Tank-ID aus URL-Parameter lesen (z.B. ?tank=TANK-001)
        const urlParams = new URLSearchParams(window.location.search);
        const tankId = urlParams.get('tank');
        
        async function loadTankData() {
            try {
                // tank-data.json von GitHub Pages laden
                const response = await fetch('tank-data.json');
                if (!response.ok) throw new Error('Tank-Daten nicht gefunden');
                
                const data = await response.json();
                
                if (!tankId) {
                    showError('Keine Tank-ID angegeben. Verwende QR-Code zum Scannen.');
                    return;
                }
                
                // Tank in den Daten finden
                const tank = data.tanks?.find(t => t.id === tankId);
                
                if (!tank) {
                    showError(`Tank "${tankId}" nicht gefunden.`);
                    return;
                }
                
                displayTankInfo(tank);
                
            } catch (error) {
                showError(`Fehler beim Laden: ${error.message}`);
            }
        }
        
        function displayTankInfo(tank) {
            const content = document.getElementById('content');
            
            const statusClass = tank.active ? 'active' : 'inactive';
            const statusText = tank.active ? 'Aktiv' : 'Inaktiv';
            
            const currentBatch = tank.currentBatch || 'Keine aktive Charge';
            const mazeration = tank.currentMazeration || 'Keine Mazeration';
            
            content.innerHTML = `
                <div class="tank-info">
                    <h2>🛢️ ${tank.name}</h2>
                    
                    <div class="info-row">
                        <span class="info-label">Tank-ID:</span>
                        <span class="info-value">${tank.id}</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Status:</span>
                        <span class="status ${statusClass}">${statusText}</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Volumen:</span>
                        <span class="info-value">${tank.volume} Liter</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Aktuelle Charge:</span>
                        <span class="info-value">${currentBatch}</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">Mazeration:</span>
                        <span class="info-value">${mazeration}</span>
                    </div>
                    
                    ${tank.location ? `
                    <div class="info-row">
                        <span class="info-label">Standort:</span>
                        <span class="info-value">${tank.location}</span>
                    </div>
                    ` : ''}
                    
                    ${tank.notes ? `
                    <div class="info-row">
                        <span class="info-label">Notizen:</span>
                        <span class="info-value">${tank.notes}</span>
                    </div>
                    ` : ''}
                </div>
                
                <div style="text-align: center; color: #6c757d; font-size: 12px; margin-top: 20px;">
                    Letzte Aktualisierung: ${new Date().toLocaleString('de-DE')}
                </div>
            `;
        }
        
        function showError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error">
                    <strong>⚠️ Fehler:</strong> ${message}
                </div>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="?" style="color: #667eea; text-decoration: none;">← Zurück</a>
                </div>
            `;
        }
        
        // Beim Laden der Seite Tank-Daten abrufen
        loadTankData();
        
        // Optional: Auto-Refresh alle 30 Sekunden
        setInterval(loadTankData, 30000);
    </script>
</body>
</html>
