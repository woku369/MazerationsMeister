# Deploy QR-Code Tank Viewer to GitHub Pages
name: Deploy Tank Viewer to Pages

on:
  # Nur triggern bei Änderungen an relevanten Dateien
  push:
    branches: ["main-pages", "pages-clean"]
    paths:
      - 'tank-data.json'
      - 'tank-data-*.json'
      - 'public/tank-viewer*.html'
      - 'public/static-qr-codes.html'
      - 'public/tank-offline.html'
      - 'public/mazeration-pwa.html'
      - 'public/mazeration-manifest.json'
      - '.github/workflows/static.yml'

  # Manueller Trigger möglich
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the public directory
          path: './public'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
