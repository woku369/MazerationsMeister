name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, main-pages, fresh-main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build Next.js App
        run: npm run build
        env:
          NODE_ENV: production
          
      - name: Copy static files to out
        run: |
          # Kopiere alle HTML-Dateien aus public/ nach out/
          cp -r public/*.html out/ || true
          cp -r public/*.js out/ || true
          cp -r public/*.css out/ || true
          cp -r public/images out/ || true
          
          # Erstelle .nojekyll (wichtig für GitHub Pages)
          touch out/.nojekyll
          
          echo "✅ Static files copied"
          ls -la out/
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
