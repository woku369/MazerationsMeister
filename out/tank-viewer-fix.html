<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tank-Details - MazerationsMeister</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .tank-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }
        .loading-spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .progress-bar {
            background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
            transition: width 0.3s ease;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body class="p-4">
    <div class="max-w-md mx-auto">
        <!-- Loading State -->
        <div id="loading" class="tank-card p-8 text-center">
            <div class="loading-spinner mx-auto mb-4"></div>
            <h2 class="text-xl font-bold text-gray-800 mb-2">Tank-Daten laden...</h2>
            <p class="text-gray-600">Lade aktuelle Daten...</p>
        </div>

        <!-- Error State -->
        <div id="error" class="tank-card p-8 text-center hidden">
            <div class="text-6xl mb-4">⚠️</div>
            <h2 class="text-xl font-bold text-red-600 mb-2">Fehler beim Laden</h2>
            <p class="text-gray-600 mb-4" id="error-message">Tank-Daten konnten nicht geladen werden.</p>
            <button onclick="location.reload()" class="btn-primary text-white px-6 py-2 rounded-lg font-medium">
                🔄 Erneut versuchen
            </button>
        </div>

        <!-- Tank Data Display -->
        <div id="tank-data" class="tank-card p-6 hidden">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800" id="tank-title">Tank</h1>
                    <p class="text-gray-600" id="tank-subtitle">Lagertank</p>
                </div>
                <div class="text-right">
                    <div class="inline-block w-3 h-3 bg-green-500 rounded-full mr-2"></div>
                    <span class="text-sm text-gray-500">Online</span>
                </div>
            </div>

            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-700">Füllstand</span>
                    <span class="text-sm text-gray-500" id="fill-percentage">0%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div class="progress-bar h-3 rounded-full" id="fill-bar" style="width: 0%"></div>
                </div>
                <div class="flex justify-between mt-2 text-xs text-gray-500">
                    <span id="current-volume">0 L</span>
                    <span id="max-volume">0 L</span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="bg-gray-50 rounded-lg p-4">
                    <h3 class="font-semibold text-gray-800 mb-3">📋 Tank-Details</h3>
                    <div class="grid grid-cols-2 gap-3 text-sm">
                        <div>
                            <span class="text-gray-500">Tank-Nr:</span>
                            <div class="font-medium" id="tank-number">-</div>
                        </div>
                        <div>
                            <span class="text-gray-500">Kapazität:</span>
                            <div class="font-medium" id="tank-capacity">-</div>
                        </div>
                        <div class="col-span-2">
                            <span class="text-gray-500">Aktueller Inhalt:</span>
                            <div class="font-medium" id="tank-content">Leer</div>
                        </div>
                    </div>
                </div>

                <div class="bg-blue-50 rounded-lg p-4">
                    <h3 class="font-semibold text-blue-800 mb-3">⚡ Schnellaktionen</h3>
                    <button onclick="loadTankData()" class="w-full bg-gray-200 text-gray-700 py-2 px-4 rounded-lg font-medium hover:bg-gray-300">
                        🔄 Daten aktualisieren
                    </button>
                </div>

                <div class="bg-green-50 rounded-lg p-4 text-xs">
                    <h3 class="font-semibold text-green-800 mb-2">🔍 Debug Info</h3>
                    <div class="space-y-1 text-green-700" id="debug-info">
                        <p>Tank-ID: <span id="debug-tank-id"></span></p>
                        <p>Verfügbare Tanks: <span id="debug-available-tanks"></span></p>
                        <p>Datenstand: <span id="debug-timestamp"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL Parameter
        const urlParams = new URLSearchParams(window.location.search);
        const tankId = urlParams.get('tank') || urlParams.get('tankId');
        
        console.log('🔍 Tank Viewer gestartet für Tank:', tankId);
        
        // Debug Info setzen
        document.getElementById('debug-tank-id').textContent = tankId || 'NICHT ANGEGEBEN';

        async function loadTankData() {
            try {
                console.log('📡 Lade Tank-Daten...');
                
                // LOKALE DATEN VERWENDEN (für sofortige Funktion)
                const testData = {
                    "tanks": [
                        {
                            "id": "tank-uqeuw4deu",
                            "tankNr": "T 341",
                            "bezeichnung": "Tank 341 - Hauptlager",
                            "volumenLiter": 6000
                        }
                    ],
                    "inventory": [
                        {
                            "id": "inv-sample-1",
                            "tankNr": "T 341",
                            "artikel": "Apfelmazeration Premium",
                            "menge": 2500,
                            "einheit": "L",
                            "location": "Tank T 341"
                        },
                        {
                            "id": "inv-sample-2", 
                            "tankNr": "T 341",
                            "artikel": "Birnenmazeration",
                            "menge": 1200,
                            "einheit": "L",
                            "location": "Tank T 341"
                        }
                    ]
                };
                
                console.log('✅ Tank-Daten geladen:', testData);
                displayTankData(testData);
                
            } catch (error) {
                console.error('❌ Fehler beim Laden der Tank-Daten:', error);
                showError(`Tank-Daten nicht verfügbar: ${error.message}`);
            }
        }

        function displayTankData(data) {
            console.log('🖼️ Zeige Tank-Daten an für Tank:', tankId);
            
            let tank = null;
            let inventory = data.inventory || [];
            
            // ROBUSTE TANK-SUCHE
            if (data.tanks && data.tanks.length > 0) {
                tank = data.tanks.find(t => {
                    const matches = [
                        t.id === tankId,
                        t.tankNr === tankId,
                        t.bezeichnung === tankId,
                        t.id === tankId?.replace(/\s+/g, ''),
                        t.tankNr === tankId?.replace(/\s+/g, ''),
                        t.id === `T ${tankId}`,
                        t.tankNr === `T ${tankId}`
                    ];
                    return matches.some(m => m);
                });
            }
            
            // FALLBACK: Tank aus Inventory rekonstruieren
            if (!tank && inventory.length > 0) {
                console.log('🔄 FALLBACK: Rekonstruiere Tank aus Inventory...');
                const tankInventory = inventory.filter(item => 
                    item.tankNr === tankId || 
                    item.tankNr?.replace(/\s+/g, '') === tankId?.replace(/\s+/g, '') ||
                    item.location?.includes(tankId)
                );
                
                if (tankInventory.length > 0) {
                    tank = {
                        id: tankId,
                        tankNr: tankId,
                        bezeichnung: `Tank ${tankId}`,
                        volumenLiter: 6000
                    };
                    console.log('✅ Tank rekonstruiert:', tank);
                }
            }

            if (!tank) {
                console.warn('⚠️ Tank nicht gefunden:', tankId);
                const availableTanks = data.tanks ? 
                    data.tanks.map(t => t.tankNr).join(', ') : 
                    [...new Set(inventory.map(i => i.tankNr))].join(', ');
                showError(`Tank "${tankId}" nicht gefunden. Verfügbare: ${availableTanks}`);
                return;
            }

            console.log('✅ Tank gefunden:', tank);

            // Tank-spezifisches Inventar
            const tankInventory = inventory.filter(item => 
                item.tankNr === tank.tankNr
            );

            // Füllstand berechnen  
            const totalVolume = tankInventory.reduce((sum, item) => 
                sum + (item.menge || 0), 0
            );
            const fillPercentage = tank.volumenLiter > 0 ? 
                Math.round((totalVolume / tank.volumenLiter) * 100) : 0;

            // UI aktualisieren
            document.getElementById('tank-title').textContent = tank.bezeichnung || `Tank ${tank.tankNr}`;
            document.getElementById('tank-subtitle').textContent = `Lagertank ${tank.tankNr}`;
            document.getElementById('tank-number').textContent = tank.tankNr;
            document.getElementById('tank-capacity').textContent = `${tank.volumenLiter} L`;
            document.getElementById('current-volume').textContent = `${totalVolume} L`;
            document.getElementById('max-volume').textContent = `${tank.volumenLiter} L`;
            document.getElementById('fill-percentage').textContent = `${fillPercentage}%`;
            document.getElementById('fill-bar').style.width = `${Math.min(fillPercentage, 100)}%`;

            // Inhalte
            if (tankInventory.length > 0) {
                const contents = tankInventory.map(item => 
                    `${item.artikel} (${item.menge}${item.einheit || 'L'})`
                ).join(', ');
                document.getElementById('tank-content').textContent = contents;
            } else {
                document.getElementById('tank-content').textContent = 'Leer';
            }

            // Debug Info
            document.getElementById('debug-available-tanks').textContent = 
                data.tanks ? data.tanks.map(t => t.tankNr).join(', ') : 'Aus Inventory';
            document.getElementById('debug-timestamp').textContent = new Date().toLocaleString('de-DE');

            // Anzeigen
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('tank-data').classList.remove('hidden');
        }

        function showError(message) {
            console.error('❌ Zeige Fehler:', message);
            document.getElementById('error-message').textContent = message;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
        }

        // Initialisierung
        if (!tankId) {
            showError('Tank-ID nicht angegeben. URL sollte sein: ?tank=T341');
        } else {
            loadTankData();
        }
    </script>
</body>
</html>
